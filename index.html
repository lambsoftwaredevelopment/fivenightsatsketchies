<meta charset="utf-8">
<title>Five Nights at Freddy's — clone</title>
<style>
  html, body {
    margin: 0; height: 100%; background: #000; overflow: hidden;
    font-family: ui-monospace, Menlo, Consolas, monospace;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  /* Fixed 1280x720 internal resolution, letterboxed to whatever the window is. */
  #game {
    width: 100%; height: 100%;
    max-width: 177.78vh;   /* 16/9 */
    max-height: 56.25vw;
    display: block;
    image-rendering: pixelated;
    cursor: crosshair;
    background: #000;
  }
</style>
<div id="wrap"><canvas id="game" width="1280" height="720"></canvas></div>
<script type="module" src="src/main.js"></script>
